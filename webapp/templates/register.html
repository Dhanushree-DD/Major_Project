{% extends "base.html" %}
{% block content %}
<div class="auth-wrapper">
    <div class="card auth-card grad-border reveal" style="max-width: 480px;">
        <div class="card-body p-4">
            <div class="text-center mb-3">
                <div class="d-inline-flex p-3 rounded-circle mb-2" style="background: var(--accent-light);">
                    <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="text-accent">
                        <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/>
                        <circle cx="9" cy="7" r="4"/>
                        <line x1="19" y1="8" x2="19" y2="14"/>
                        <line x1="22" y1="11" x2="16" y2="11"/>
                    </svg>
                </div>
                <h3 class="fw-bold mb-1">Doctor Registration</h3>
                <p class="text-muted small mb-0">Create a clinical account to analyze fetal brain scans</p>
            </div>

            <form method="post">
                <div class="mb-3">
                    <label class="form-label fw-semibold">Doctor Full Name <span class="text-danger">*</span></label>
                    <input type="text" class="form-control" name="name" placeholder="Dr. Jane Doe" required>
                </div>
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label fw-semibold">Email Address <span class="text-danger">*</span></label>
                        <input type="email" class="form-control" name="email" placeholder="doctor@hospital.org" required>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label fw-semibold">Phone Number <span class="text-danger">*</span></label>
                        <input type="tel" class="form-control" name="phone" placeholder="+1 234 567 890" required>
                    </div>
                </div>
                <div class="mb-3">
                    <label class="form-label fw-semibold">Hospital / Diagnostic Centre</label>
                    <input type="text" class="form-control" name="organisation" placeholder="e.g., AIT Memorial Hospital & Research Centre">
                </div>
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label fw-semibold">Password <span class="text-danger">*</span></label>
                        <input type="password" class="form-control" name="password" placeholder="••••••••" required>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label fw-semibold">Confirm Password <span class="text-danger">*</span></label>
                        <input type="password" class="form-control" name="confirm_password" placeholder="••••••••" required>
                    </div>
                </div>
                <button type="submit" class="btn btn-accent w-100 py-2 fw-semibold mt-2">
                    Complete Registration
                </button>
            </form>
            <p class="text-center mt-4 mb-0 text-muted small">
                Already registered?
                <a href="{{ url_for('login') }}" class="auth-link fw-semibold">Sign In</a>
            </p>
        </div>
    </div>
</div>
{% endblock %}
